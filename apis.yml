aid: ablative-solutions
name: Ablative Solutions
description: 'Ablative Solutions, Inc. is a privately held, clinical-stage medical device
  company founded in 2011 and headquartered in Kalamazoo, Michigan, with offices in San
  Jose, California. It develops the Peregrine System, a percutaneous catheter platform
  that performs chemical renal denervation by infusing dehydrated alcohol into the
  perivascular space around the renal arteries to deactivate surrounding sympathetic
  nerves, as a treatment for systemic and uncontrolled hypertension. The Peregrine System
  Infusion Catheter holds FDA 510(k) clearance for infusion of diagnostic and therapeutic
  agents into the perivascular area of the peripheral vasculature; the Peregrine System
  Kit remains an investigational product under clinical study in the United States and
  has received FDA Breakthrough Device Designation for drug-resistant hypertension. The
  company is certified to ISO 13485. Ablative Solutions publishes a small corporate and
  clinical-information website only; it operates no developer program, public API,
  documentation portal, or machine-readable specifications.'
